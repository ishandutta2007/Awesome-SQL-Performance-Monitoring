<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse {
        animation: pulseGlow 4s ease-in-out infinite alternate;
      }
      @keyframes pulseGlow {
        0% { opacity: 0.3; transform: scale(0.98); }
        100% { opacity: 0.8; transform: scale(1.02); }
      }
      .wave {
        stroke-dasharray: 800;
        stroke-dashoffset: 800;
        animation: dash 5s linear infinite;
      }
      @keyframes dash {
        to { stroke-dashoffset: 0; }
      }
      .beacon {
        animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
      @keyframes ping {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      .bar-anim {
        animation: barHeight 3s ease-in-out infinite alternate;
        transform-origin: bottom;
      }
      @keyframes barHeight {
        0% { transform: scaleY(0.7); }
        100% { transform: scaleY(1.1); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Background Grid -->
  <g opacity="0.12" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="250" y1="0" x2="250" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="550" y1="0" x2="550" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="850" y1="0" x2="850" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
    <line x1="1150" y1="0" x2="1150" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Dynamic Glowing Orbs -->
  <circle cx="950" cy="180" r="160" fill="#38bdf8" opacity="0.08" filter="url(#glow)" class="pulse" />
  <circle cx="250" cy="300" r="120" fill="#818cf8" opacity="0.07" filter="url(#glow)" />
  <circle cx="700" cy="80" r="90" fill="#22c55e" opacity="0.06" filter="url(#glow)" />

  <!-- Database Cylinders Graphic & Performance Metrics -->
  <g transform="translate(820, 110)">
    <!-- Metrics card background -->
    <rect x="-30" y="-30" width="360" height="240" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#334155" stroke-width="1.5" />
    
    <!-- Pulse Line chart inside graphic -->
    <path d="M-10 130 Q 30 70, 70 110 T 150 60 T 230 100 T 310 40" fill="none" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#softGlow)" />
    <path d="M-10 130 Q 30 70, 70 110 T 150 60 T 230 100 T 310 40 L 310 170 L -10 170 Z" fill="url(#gridGrad)" />

    <!-- Performance Bars -->
    <rect x="10" y="140" width="14" height="25" rx="3" fill="#38bdf8" opacity="0.8" class="bar-anim" />
    <rect x="35" y="125" width="14" height="40" rx="3" fill="#818cf8" opacity="0.8" />
    <rect x="60" y="110" width="14" height="55" rx="3" fill="#22c55e" opacity="0.85" class="bar-anim" />
    <rect x="85" y="130" width="14" height="35" rx="3" fill="#38bdf8" opacity="0.7" />
    <rect x="110" y="95" width="14" height="70" rx="3" fill="#a855f7" opacity="0.85" class="bar-anim" />
    <rect x="135" y="120" width="14" height="45" rx="3" fill="#06b6d4" opacity="0.8" />

    <!-- Query status indicators -->
    <g transform="translate(190, 10)">
      <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#22c55e" filter="url(#softGlow)" />
      <circle cx="16" cy="16" r="10" fill="none" stroke="#22c55e" stroke-width="1" class="beacon" />
      <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#f8fafc">QPS 48.2k</text>
    </g>

    <!-- Latency chip -->
    <g transform="translate(0, 10)">
      <rect width="125" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
      <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#93c5fd">⚡ p99 &lt; 1.4ms</text>
    </g>

    <!-- Animated Scanning Radar Line -->
    <line x1="0" y1="170" x2="300" y2="170" stroke="#334155" stroke-dasharray="4,4" />
  </g>

  <!-- Left Content: Titles, Subtitles, Badges -->
  <g transform="translate(80, 75)">
    <!-- Category Pill Tag -->
    <rect width="250" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8" filter="url(#softGlow)" />
    <text x="26" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">DATABASE OBSERVABILITY</text>

    <!-- Main Title -->
    <text x="0" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#primaryGrad)" letter-spacing="-1">
      Awesome SQL Performance
    </text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-1">
      Monitoring ⚡
    </text>

    <!-- Subtitle -->
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Curated ecosystem of SaaS &amp; Open-Source tools for Query Profiling,
    </text>
    <text x="0" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
      Wait-Event Analysis, Index Advisors, and Estate-Wide DBA Visibility.
    </text>

    <!-- Highlight Feature Chips -->
    <g transform="translate(0, 230)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">🔍 Query Analytics</text>

      <!-- Chip 2 -->
      <rect x="145" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="160" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a855f7">⏱️ Wait Analysis</text>

      <!-- Chip 3 -->
      <rect x="295" y="0" width="135" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="310" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#22c55e">💡 Index Advisors</text>

      <!-- Chip 4 -->
      <rect x="445" y="0" width="125" height="32" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="460" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f59e0b">📊 DBA Health</text>
    </g>
  </g>
</svg>
